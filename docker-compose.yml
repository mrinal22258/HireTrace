version: '3.8'

services:
  hiretrace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiretrace_app
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hiretrace}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hiretrace}
      - CONCURRENCY_WORKERS=${CONCURRENCY_WORKERS:-4}
      - MAX_LLM_CONCURRENCY=${MAX_LLM_CONCURRENCY:-1}
    volumes:
      - hiretrace_uploads:/app/uploads
    depends_on:
      - postgres
      - ollama
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: hiretrace_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-hiretrace}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-hiretrace}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: hiretrace_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  hiretrace_uploads:
  postgres_data:
  ollama_models:
