name: HireTrace CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run test suite with offline mock backend
        env:
          HIRETRACE_OFFLINE_MOCK: "1"
          PYTHONPATH: "."
        run: |
          pytest --cov=agents --cov=baseline --cov=ui --cov-report=term-missing --cov-report=xml

      - name: Verify static export build integrity
        run: |
          python scripts/build_static.py
          git diff --exit-code index.html static_data.js
